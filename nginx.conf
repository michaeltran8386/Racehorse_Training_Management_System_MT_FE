server {
    listen 80;
    server_name localhost;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Vào tên miền là thấy landing ngay, không qua bước React chuyển hướng.
    location = / {
        root /usr/share/nginx/html;
        try_files /landing.html =404;
    }

    # $uri.html: /privacy và /terms mở được không cần đuôi .html.
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri.html $uri/ /index.html;
    }

    # /api và /socket.io do Caddy (BE repo: deploy/Caddyfile) chuyển thẳng tới backend,
    # nên container này chạy được một mình khi mới đưa landing lên.

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
