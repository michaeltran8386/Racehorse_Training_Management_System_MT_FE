<!doctype html>
<html lang="en" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Horse club management workspace" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/images/logo-fivegates.svg" />
    <title>TMEC</title>
    <!-- Set theme trước khi vẽ trang để không chớp trắng; logic khớp src/shared/lib/theme.ts -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem("equiflow-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
